en:
  activerecord:
    attributes:
    errors:
      models:
  users:
    oauth_handoff:
      # On screen for however long Entra takes, so it has to read as progress
      # rather than as a broken page.
      fresh:
        heading: "Signing you in…"
        body: "Please wait while we take you to the Ministry of Justice sign in page."
        button: "Continue to sign in"
      signed_out:
        heading: "You have been signed out"
        body: "You can sign in again at any time."
        button: "Sign in"
      expired:
        heading: "Your session has expired"
        body: "You were signed out because you were inactive for a while."
        button: "Sign in again"
  errors:
    unprocessable_content:
      page_title: "Error - 422 - Request could not be processed"
      heading: "Sorry, we could not process that request"
      body: "This can happen if a page was left open for a long time. Please go back and try again."
      contact_prefix: "If it keeps happening, please contact "
      contact_suffix: " with the details to report this issue."
    sign_in_failed:
      page_title: "Error - 403 - Sign in could not be completed"
      heading: "We could not complete your sign in"
      no_access: "Your account may not have permission to use the Parliamentary Questions Tracker."
      contact_prefix: "If you think this is wrong, please contact "
      contact_suffix: " and include the time you tried to sign in."
