name: CI Workflow
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby files
        run: bundle exec rubocop

      - name: Security audit application code
        run: bundle exec brakeman -q

      - name: Snyk dependency scan (Ruby)
        uses: snyk/actions/ruby@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Install packages
        run: yarn install --pure-lockfile

      - name: Snyk dependency scan (Node)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write

    strategy:
      fail-fast: false
      matrix:
        ci_total_jobs: [4]
        # parallel_tests --only-group is 1-based; 0 is rejected since 5.9.0
        ci_job_index: ["1", "2", "3", "4"]

    env:
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1"
      PQ_REST_API_HOST: http://localhost:8888
      GOVUK_NOTIFY_API_KEY: ${{ secrets.GOVUK_NOTIFY_API_KEY }}
      CI: true
      CI_TOTAL_JOBS: ${{ matrix.ci_total_jobs }}
      CI_JOB_INDEX: ${{ matrix.ci_job_index }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install packages
        run: yarn install --pure-lockfile

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Setup test database
        run: bin/rails db:setup

      - name: Run unit and feature tests
        run: bundle exec parallel_rspec -n "${CI_TOTAL_JOBS}" --only-group "${CI_JOB_INDEX}" --group-by "runtime"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: coverage-${{env.CI_JOB_INDEX}}
          path: coverage/.resultset.json

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      RAILS_ENV: test
      GOVUK_NOTIFY_API_KEY: ${{ secrets.GOVUK_NOTIFY_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          path: coverage

      - name: Collate coverage
        run: bundle exec rake coverage:report

      # Posts the `SimpleCov` check run that branch protection on main requires.
      #
      # This replaces joshmfrankel/simplecov-check-action, which created the check
      # run and then immediately PATCHed it to completion. That second request
      # intermittently 404'd on a check run GitHub had created ~1s earlier (replica
      # lag), and the action has no retry, so the job failed and the check was left
      # stuck in_progress. Creating the run already-completed in a single POST
      # removes the second request, and with it the race.
      #
      # Only the suite-wide gate is enforced. The action's minimum_file_coverage
      # was always inert here: it is applied only when coverage/coverage.json
      # exists, and spec_helper.rb uses the default HTML formatter, so that file
      # is never written.
      - name: Code coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On pull_request, github.sha is the merge commit; the check must be
          # attached to the PR head or it will not satisfy branch protection.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MINIMUM_SUITE_COVERAGE: "75"
        run: |
          set -euo pipefail

          if [ ! -r coverage/.last_run.json ]; then
            echo "::error::coverage/.last_run.json not found - did 'rake coverage:report' run?"
            exit 1
          fi

          covered=$(jq -er '.result.line' coverage/.last_run.json)

          if awk "BEGIN { exit !($covered >= $MINIMUM_SUITE_COVERAGE) }"; then
            conclusion=success
          else
            conclusion=failure
          fi

          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg covered "$covered" \
            --arg minimum "$MINIMUM_SUITE_COVERAGE" \
            '{
              name: "SimpleCov",
              head_sha: $sha,
              status: "completed",
              conclusion: $conclusion,
              output: {
                title: "\($covered)% covered (minimum \($minimum)%)",
                summary: "* \($covered)% covered\n* \($minimum)% minimum coverage for suite"
              }
            }' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input - --silent

          if [ "$conclusion" = "failure" ]; then
            echo "::error::Coverage $covered% is below the minimum $MINIMUM_SUITE_COVERAGE%"
            exit 1
          fi

          echo "Coverage $covered% meets the minimum $MINIMUM_SUITE_COVERAGE%"

  build-and-deploy:
    needs: [linting, coverage]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
